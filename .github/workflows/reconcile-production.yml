name: Reconcile RSVP Society Production Data

on:
  workflow_dispatch:
    inputs:
      fail_on_error:
        description: Fail the workflow if reconciliation errors are found
        required: false
        type: boolean
        default: false

env:
  AWS_REGION: us-east-1

permissions:
  contents: read

jobs:
  reconcile:
    name: Read-only DynamoDB reconciliation
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.13
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install audit dependency
        run: pip install -r backend/lambda/requirements.txt

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Run read-only production reconciliation
        run: |
          python backend/tools/production_reconcile.py \
            --region "$AWS_REGION" \
            --json production-reconciliation.json

      - name: Write reconciliation summary
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          report = json.loads(Path("production-reconciliation.json").read_text())
          s = report["summary"]
          c = report["tableCounts"]
          print("## RSVP Society Production Reconciliation")
          print("")
          print("**Mode:** read-only")
          print(f"**Errors:** {s['errors']}  ")
          print(f"**Warnings:** {s['warnings']}  ")
          print(f"**Total findings:** {s['findings']}  ")
          print("")
          print("Scanned: " + ", ".join(f"{k}={v}" for k, v in c.items()))
          PY

      - name: Upload redacted reconciliation report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: production-reconciliation.json
          archive: false
          retention-days: 14

      - name: Enforce clean reconciliation when requested
        if: ${{ inputs.fail_on_error }}
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          errors = json.loads(Path("production-reconciliation.json").read_text())["summary"]["errors"]
          if errors:
              raise SystemExit(f"Production reconciliation found {errors} error(s).")
          PY
