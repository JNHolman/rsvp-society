<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gallery — RSVP Society</title>
<meta name="description" content="RSVP Society event gallery. Moments from the room.">
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Montserrat:wght@200;300;400;500&display=swap" rel="stylesheet">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='15' fill='%23060608' stroke='%23C9A84C' stroke-width='1.5'/%3E%3Ctext x='16' y='21' font-family='Georgia,serif' font-size='14' font-weight='bold' fill='%23E8D08A' text-anchor='middle'%3ER%3C/text%3E%3C/svg%3E">
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --gold: #D4B96A;
  --gold-dim: rgba(212,185,106,0.5);
  --black: #060608;
  --black-2: #0C0C10;
  --white: #F8F4EC;
  --white-dim: rgba(248,244,236,0.82);
}

body {
  background: var(--black);
  color: var(--white);
  font-family: 'Montserrat', sans-serif;
  font-weight: 300;
  min-height: 100vh;
  cursor: none;
}

.cursor { position: fixed; width: 5px; height: 5px; background: var(--gold); border-radius: 50%; pointer-events: none; z-index: 9999; transform: translate(-50%,-50%); }
.cursor-ring { position: fixed; width: 24px; height: 24px; border: 1px solid rgba(212,185,106,0.3); border-radius: 50%; pointer-events: none; z-index: 9998; transform: translate(-50%,-50%); transition: width .3s, height .3s; }

nav {
  position: fixed;
  top: 0; left: 0; right: 0;
  z-index: 200;
  padding: 28px 60px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: linear-gradient(180deg, rgba(6,6,8,0.75) 0%, transparent 100%);
}
.nav-wordmark {
  font-family: 'Cormorant Garamond', serif;
  font-weight: 400;
  font-size: 12px;
  letter-spacing: 0.5em;
  text-transform: uppercase;
  color: var(--gold);
  text-decoration: none;
}
.nav-back {
  font-family: 'Montserrat', sans-serif;
  font-size: 10px;
  font-weight: 300;
  letter-spacing: 0.35em;
  text-transform: uppercase;
  color: rgba(248,244,236,0.9);
  text-decoration: none;
  transition: color .2s;
}
.nav-back:hover { color: var(--gold); }

.page-header {
  padding: 140px 60px 100px;
  text-align: center;
}

.eyebrow {
  font-family: 'Montserrat', sans-serif;
  font-size: 11px;
  letter-spacing: 0.48em;
  text-transform: uppercase;
  color: var(--gold);
  opacity: 0.9;
  margin-bottom: 28px;
}

.page-headline {
  font-family: 'Cormorant Garamond', serif;
  font-weight: 300;
  font-style: italic;
  font-size: 56px;
  color: var(--white);
  line-height: 1.05;
  margin-bottom: 40px;
}

/* Event folder tabs */
.folder-nav {
  display: flex; gap: 2px; padding: 32px 60px 0;
  overflow-x: auto; border-bottom: 1px solid rgba(212,185,106,0.07);
}
.folder-btn {
  background: none; border: none;
  font-family: 'Montserrat', sans-serif; font-size: 8px;
  letter-spacing: 0.35em; text-transform: uppercase;
  color: rgba(248,244,236,0.4); cursor: none;
  padding: 14px 20px; border-bottom: 1px solid transparent;
  transition: color .2s, border-color .2s; white-space: nowrap;
}
.folder-btn:hover, .folder-btn.active {
  color: var(--gold); border-bottom-color: var(--gold);
}

/* Gallery grid */
.gallery-section { padding: 48px 60px 80px; }

.gallery-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap: 3px;
}

.photo-item {
  position: relative; overflow: hidden;
  background: var(--black-2);
  aspect-ratio: 4/3;
  cursor: none;
}

.photo-item img {
  width: 100%; height: 100%; object-fit: cover;
  transition: transform .6s cubic-bezier(0.16,1,0.3,1), opacity .3s;
  opacity: 0;
}
.photo-item img.loaded { opacity: 1; }
.photo-item:hover img { transform: scale(1.04); }

.photo-item::after {
  content: ''; position: absolute; inset: 0;
  background: linear-gradient(180deg, transparent 60%, rgba(6,6,8,0.4) 100%);
  opacity: 0; transition: opacity .3s;
}
.photo-item:hover::after { opacity: 1; }

/* Lightbox */
.lightbox {
  position: fixed; inset: 0; z-index: 500;
  background: rgba(6,6,8,0.97);
  display: none; align-items: center; justify-content: center;
}
.lightbox.open { display: flex; }
.lightbox-img {
  max-width: 90vw; max-height: 90vh;
  object-fit: contain;
}
.lightbox-close {
  position: fixed; top: 32px; right: 40px;
  background: none; border: none; color: var(--white-dim);
  font-family: 'Montserrat', sans-serif; font-size: 9px;
  letter-spacing: 0.4em; text-transform: uppercase;
  cursor: none; transition: color .2s;
}
.lightbox-close:hover { color: var(--gold); }
.lightbox-nav {
  position: fixed; top: 50%; transform: translateY(-50%);
  background: none; border: 1px solid rgba(212,185,106,0.15);
  color: var(--white-dim); width: 44px; height: 44px;
  display: flex; align-items: center; justify-content: center;
  cursor: none; transition: all .2s; font-size: 16px;
}
.lightbox-nav:hover { border-color: var(--gold); color: var(--gold); }
.lightbox-prev { left: 32px; }
.lightbox-next { right: 32px; }

/* Empty state */
.empty-gallery {
  text-align: center; padding: 100px 0;
  font-family: 'Cormorant Garamond', serif;
  font-style: italic; font-size: 22px;
  color: rgba(248,244,236,0.2);
}
.empty-sub {
  font-family: 'Montserrat', sans-serif; font-style: normal;
  font-size: 9px; letter-spacing: 0.3em; text-transform: uppercase;
  color: rgba(212,185,106,0.2); margin-top: 16px;
}

@media (max-width: 768px) {
  .cursor, .cursor-ring { display: none !important; }
  * { cursor: auto !important; }
  nav { padding: 20px 24px; }
  .page-header {
  padding: 140px 60px 100px;
  text-align: center;
}
  .folder-nav { padding: 0 24px; }
  .gallery-section { padding: 32px 24px 60px; }
  .gallery-grid { grid-template-columns: repeat(2, 1fr); gap: 2px; }
  .page-headline {
  font-family: 'Cormorant Garamond', serif;
  font-weight: 300;
  font-style: italic;
  font-size: 56px;
  color: var(--white);
  line-height: 1.05;
  margin-bottom: 40px;
}
}
</style>
</head>
<body>

<div class="cursor" id="cursor"></div>
<div class="cursor-ring" id="ring"></div>

<nav>
  <a href="/" class="nav-wordmark">[RSVP] Society</a>
  <a href="/" class="nav-back">← Back</a>
</nav>

<div class="page-header">
  <p class="eyebrow">Gallery</p>
  <h1 class="page-headline">Moments from the room.</h1>
</div>

<div class="folder-nav" id="folder-nav"></div>

<div class="gallery-section">
  <div id="gallery-container">
    <div class="empty-gallery">
      Photos coming soon.
      <div class="empty-sub">Check back after the next event.</div>
    </div>
  </div>
</div>

<!-- Lightbox -->
<div class="lightbox" id="lightbox">
  <button class="lightbox-close" onclick="closeLightbox()">Close</button>
  <button class="lightbox-nav lightbox-prev" onclick="lightboxNav(-1)">&#8592;</button>
  <img class="lightbox-img" id="lightbox-img" src="" alt="">
  <button class="lightbox-nav lightbox-next" onclick="lightboxNav(1)">&#8594;</button>
</div>

<script>
// ── CONFIG ──
// Update CLOUDFRONT_BASE after terraform apply creates the distribution.
// Run: terraform output pics_cloudfront_url
// Then replace the placeholder below.
const CLOUDFRONT_BASE = 'https://d31o74npegx00h.cloudfront.net';

// Event folders — add a new entry here each month after uploading photos.
// Format: { id: 'folder-name-in-s3', label: 'Display Name' }
const EVENT_FOLDERS = [
  // { id: '2026-03-march', label: 'March 2026' },
  // { id: '2026-04-april', label: 'April 2026' },
];

// Photo filenames per folder — update after uploading to S3.
// Format: { folder: 'folder-id', files: ['photo1.jpg', 'photo2.jpg', ...] }
const PHOTO_MANIFEST = [
  // { folder: '2026-03-march', files: ['001.jpg', '002.jpg', '003.jpg'] },
];

// ── State ──
let currentFolder = null;
let lightboxPhotos = [];
let lightboxIndex = 0;

// ── Cursor ──
const cursor = document.getElementById('cursor');
const ring   = document.getElementById('ring');
let mx = 0, my = 0, rx = 0, ry = 0;
document.addEventListener('mousemove', e => {
  mx = e.clientX; my = e.clientY;
  cursor.style.left = mx + 'px'; cursor.style.top = my + 'px';
});
(function animRing() {
  rx += (mx - rx) * 0.12; ry += (my - ry) * 0.12;
  ring.style.left = rx + 'px'; ring.style.top = ry + 'px';
  requestAnimationFrame(animRing);
})();

// ── Init ──
function init() {
  const nav = document.getElementById('folder-nav');

  if (!EVENT_FOLDERS.length) return; // No folders yet — empty state stays

  EVENT_FOLDERS.forEach((folder, i) => {
    const btn = document.createElement('button');
    btn.className = 'folder-btn' + (i === 0 ? ' active' : '');
    btn.textContent = folder.label;
    btn.onclick = () => loadFolder(folder.id, btn);
    nav.appendChild(btn);
  });

  // Load first folder
  loadFolder(EVENT_FOLDERS[0].id, nav.querySelector('.folder-btn'));
}

function loadFolder(folderId, btn) {
  currentFolder = folderId;

  document.querySelectorAll('.folder-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');

  const manifest = PHOTO_MANIFEST.find(m => m.folder === folderId);
  const files = manifest ? manifest.files : [];
  const container = document.getElementById('gallery-container');
  container.textContent = '';

  if (!files.length) {
    const empty = document.createElement('div');
    empty.className = 'empty-gallery';
    empty.textContent = 'No photos yet.';
    const sub = document.createElement('div');
    sub.className = 'empty-sub';
    sub.textContent = 'Photos from this event coming soon.';
    empty.appendChild(sub);
    container.appendChild(empty);
    return;
  }

  lightboxPhotos = files.map(f => `${CLOUDFRONT_BASE}/${folderId}/${f}`);

  const grid = document.createElement('div');
  grid.className = 'gallery-grid';

  files.forEach((f, i) => {
    const item = document.createElement('div');
    item.className = 'photo-item';
    item.addEventListener('click', () => openLightbox(i));

    const img = document.createElement('img');
    img.src = `${CLOUDFRONT_BASE}/${folderId}/${f}`;
    img.alt = 'RSVP Society event photo';
    img.loading = 'lazy';
    img.addEventListener('load', () => img.classList.add('loaded'));

    item.appendChild(img);
    grid.appendChild(item);
  });

  container.appendChild(grid);
}

// ── Lightbox ──
function openLightbox(index) {
  lightboxIndex = index;
  document.getElementById('lightbox-img').src = lightboxPhotos[index];
  document.getElementById('lightbox').classList.add('open');
}

function closeLightbox() {
  document.getElementById('lightbox').classList.remove('open');
  document.getElementById('lightbox-img').src = '';
}

function lightboxNav(dir) {
  lightboxIndex = (lightboxIndex + dir + lightboxPhotos.length) % lightboxPhotos.length;
  document.getElementById('lightbox-img').src = lightboxPhotos[lightboxIndex];
}

document.getElementById('lightbox').addEventListener('click', e => {
  if (e.target === e.currentTarget) closeLightbox();
});

document.addEventListener('keydown', e => {
  if (!document.getElementById('lightbox').classList.contains('open')) return;
  if (e.key === 'Escape') closeLightbox();
  if (e.key === 'ArrowRight') lightboxNav(1);
  if (e.key === 'ArrowLeft') lightboxNav(-1);
});

init();
</script>
</body>
</html>
