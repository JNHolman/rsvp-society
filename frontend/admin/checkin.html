<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RSVP Society — Check In</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300&family=Montserrat:wght@200;300;400;500&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --gold: #D4B96A;
  --gold-dim: rgba(212,185,106,0.5);
  --gold-faint: rgba(212,185,106,0.08);
  --black: #060608;
  --black-2: #0C0C10;
  --black-3: #111116;
  --white: #F8F4EC;
  --white-dim: rgba(248,244,236,0.82);
  --white-faint: rgba(248,244,236,0.12);
  --green: #4CAF7D;
  --green-faint: rgba(76,175,125,0.08);
  --red: #C0474A;
}

body {
  background: var(--black);
  color: var(--white);
  font-family: 'Montserrat', sans-serif;
  font-weight: 300;
  min-height: 100vh;
  min-height: 100dvh;
  -webkit-tap-highlight-color: transparent;
}

/* ── Login ── */
#login-screen {
  min-height: 100vh;
  min-height: 100dvh;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  padding: 24px;
}
.login-wordmark {
  font-family: 'Cormorant Garamond', serif;
  font-size: 11px;
  letter-spacing: 0.5em;
  color: var(--gold);
  text-transform: uppercase;
  margin-bottom: 48px;
  opacity: 0.7;
}
.login-box {
  width: 100%;
  max-width: 340px;
  border: 1px solid rgba(212,185,106,0.12);
  background: var(--black-2);
  padding: 36px 28px;
}
.login-label {
  font-size: 9px;
  letter-spacing: 0.4em;
  text-transform: uppercase;
  color: rgba(212,185,106,0.8);
  display: block;
  margin-bottom: 12px;
}
.login-input {
  width: 100%;
  background: transparent;
  border: none;
  border-bottom: 1px solid rgba(212,185,106,0.2);
  color: var(--white);
  font-family: 'Montserrat', sans-serif;
  font-weight: 300;
  font-size: 16px;
  letter-spacing: 0.15em;
  padding: 10px 0;
  outline: none;
  transition: border-color .2s;
  margin-bottom: 28px;
}
.login-input:focus { border-color: var(--gold); }
.login-btn {
  width: 100%;
  background: transparent;
  border: 1px solid rgba(212,185,106,0.3);
  color: var(--gold);
  font-family: 'Montserrat', sans-serif;
  font-size: 9px;
  letter-spacing: 0.4em;
  text-transform: uppercase;
  padding: 14px;
  cursor: pointer;
  transition: background .2s;
}
.login-btn:hover { background: var(--gold-faint); }
.login-error {
  font-size: 10px;
  color: var(--red);
  letter-spacing: 0.1em;
  text-align: center;
  margin-top: 14px;
  min-height: 16px;
}

/* ── App ── */
#app { display: none; flex-direction: column; min-height: 100vh; }

/* ── Header ── */
header {
  background: rgba(6,6,8,0.97);
  border-bottom: 1px solid rgba(212,185,106,0.07);
  padding: 14px 20px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  position: sticky;
  top: 0;
  z-index: 20;
}
.header-left { display: flex; flex-direction: column; gap: 2px; }
.wordmark {
  font-family: 'Cormorant Garamond', serif;
  font-size: 14px;
  letter-spacing: 0.35em;
  color: var(--gold);
}
.header-sub {
  font-size: 8px;
  letter-spacing: 0.35em;
  text-transform: uppercase;
  color: rgba(248,244,236,0.4);
}
.signout-btn {
  background: none;
  border: 1px solid rgba(212,185,106,0.15);
  color: var(--white-dim);
  font-family: 'Montserrat', sans-serif;
  font-size: 8px;
  letter-spacing: 0.3em;
  text-transform: uppercase;
  padding: 8px 14px;
  cursor: pointer;
  transition: all .2s;
}
.signout-btn:hover { border-color: rgba(212,185,106,0.6); color: var(--gold); }

/* ── Event Banner ── */
#event-banner {
  background: var(--black-2);
  border-bottom: 1px solid rgba(212,185,106,0.08);
  padding: 14px 20px;
  display: none;
}
.banner-grid {
  display: flex;
  gap: 24px;
  flex-wrap: wrap;
  align-items: center;
}
.banner-item { display: flex; flex-direction: column; gap: 3px; }
.banner-label {
  font-size: 7px;
  letter-spacing: 0.4em;
  text-transform: uppercase;
  color: rgba(248,244,236,0.3);
}
.banner-value {
  font-size: 13px;
  color: var(--white);
  letter-spacing: 0.03em;
}
.banner-value.gold { color: var(--gold); }

/* ── Counter ── */
#counter-bar {
  background: var(--black-3);
  border-bottom: 1px solid rgba(212,185,106,0.06);
  padding: 14px 20px;
  display: flex;
  align-items: center;
  gap: 12px;
}
.counter-num {
  font-family: 'Cormorant Garamond', serif;
  font-size: 48px;
  font-weight: 300;
  color: var(--green);
  line-height: 1;
}
.counter-sep {
  font-size: 32px;
  color: rgba(248,244,236,0.15);
}
.counter-total {
  font-family: 'Cormorant Garamond', serif;
  font-size: 48px;
  font-weight: 300;
  color: rgba(248,244,236,0.25);
  line-height: 1;
}
.counter-label {
  font-size: 9px;
  letter-spacing: 0.3em;
  text-transform: uppercase;
  color: rgba(248,244,236,0.3);
  margin-left: 8px;
}
.counter-pct {
  margin-left: auto;
  font-size: 16px;
  letter-spacing: 0.1em;
  color: var(--gold-dim);
}
.progress-bar-wrap {
  height: 3px;
  background: rgba(248,244,236,0.04);
}
.progress-bar-fill {
  height: 100%;
  background: var(--green);
  transition: width 0.4s ease;
  width: 0%;
}

/* ── Search ── */
.search-wrap {
  padding: 12px 20px;
  background: var(--black);
  border-bottom: 1px solid rgba(248,244,236,0.04);
}
.search-input-wrap {
  position: relative;
  display: flex;
  align-items: center;
}
.search-input {
  width: 100%;
  background: var(--black-2);
  border: 1px solid rgba(212,185,106,0.1);
  color: var(--white);
  font-family: 'Montserrat', sans-serif;
  font-weight: 300;
  font-size: 16px;
  padding: 14px 44px 14px 16px;
  outline: none;
  transition: border-color .2s;
  -webkit-appearance: none;
  border-radius: 0;
}
.search-input:focus { border-color: rgba(212,185,106,0.35); }
.search-input::placeholder { color: rgba(248,244,236,0.2); }
.clear-btn {
  position: absolute;
  right: 12px;
  background: none;
  border: none;
  color: rgba(248,244,236,0.3);
  font-size: 18px;
  cursor: pointer;
  padding: 8px;
  display: none;
  line-height: 1;
}
.clear-btn.visible { display: block; }

/* ── Alpha bar ── */
.alpha-bar {
  display: flex;
  flex-wrap: wrap;
  padding: 6px 16px;
  background: var(--black);
  border-bottom: 1px solid rgba(248,244,236,0.03);
  gap: 0;
}
.alpha-btn {
  background: none;
  border: none;
  color: rgba(212,185,106,0.2);
  font-family: 'Montserrat', sans-serif;
  font-size: 10px;
  letter-spacing: 0.05em;
  padding: 5px 7px;
  cursor: pointer;
  transition: color .1s;
  min-width: 26px;
  text-align: center;
}
.alpha-btn.has-members { color: rgba(212,185,106,0.55); }
.alpha-btn:active { color: var(--gold); }

/* ── Guest list ── */
#guest-list { flex: 1; padding-bottom: 60px; }

.alpha-header {
  padding: 8px 20px 5px;
  font-size: 9px;
  letter-spacing: 0.4em;
  text-transform: uppercase;
  color: rgba(212,185,106,0.35);
  background: var(--black);
  border-bottom: 1px solid rgba(248,244,236,0.03);
}

.guest-row {
  display: flex;
  align-items: center;
  padding: 0 20px;
  min-height: 76px;
  border-bottom: 1px solid rgba(248,244,236,0.05);
  transition: background .2s;
  gap: 16px;
}
.guest-row.checked-in { background: var(--green-faint); }
.guest-info { flex: 1; min-width: 0; }
.guest-name {
  font-size: 20px;
  font-weight: 400;
  color: var(--white);
  letter-spacing: 0.01em;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.guest-row.checked-in .guest-name { color: var(--green); }
.guest-meta {
  font-size: 12px;
  color: rgba(248,244,236,0.3);
  margin-top: 4px;
}

.checkin-btn {
  flex-shrink: 0;
  background: transparent;
  border: 1px solid rgba(212,185,106,0.25);
  color: var(--gold);
  font-family: 'Montserrat', sans-serif;
  font-size: 10px;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  padding: 14px 24px;
  cursor: pointer;
  transition: all .15s;
  min-width: 110px;
  text-align: center;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}
.checkin-btn:active { background: var(--gold-faint); transform: scale(0.96); }
.checkin-btn.done {
  background: var(--green-faint);
  border-color: rgba(76,175,125,0.25);
  color: var(--green);
  cursor: default;
}

.state-msg {
  padding: 60px 20px;
  text-align: center;
  font-size: 11px;
  letter-spacing: 0.2em;
  color: rgba(248,244,236,0.2);
  text-transform: uppercase;
}

/* ── Toast ── */
.toast {
  position: fixed;
  bottom: 28px;
  left: 50%;
  transform: translateX(-50%) translateY(16px);
  background: var(--black-3);
  border: 1px solid rgba(212,185,106,0.15);
  color: var(--white);
  font-size: 11px;
  letter-spacing: 0.15em;
  padding: 12px 28px;
  opacity: 0;
  transition: all .25s;
  pointer-events: none;
  white-space: nowrap;
  z-index: 100;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
.toast.success { border-color: rgba(76,175,125,0.4); color: var(--green); }
.toast.error { border-color: rgba(192,71,74,0.4); color: var(--red); }
</style>
</head>
<body>

<div id="login-screen">
  <div class="login-wordmark">[RSVP] Society</div>
  <div class="login-box">
    <label class="login-label" for="token-input">Admin Token</label>
    <input type="password" id="token-input" class="login-input" placeholder="••••••••••••" autocomplete="off" />
    <button class="login-btn" id="login-btn" onclick="doLogin()">Enter</button>
    <div class="login-error" id="login-error"></div>
  </div>
</div>

<div id="app">
  <header>
    <div class="header-left">
      <span class="wordmark">[RSVP]</span>
      <span class="header-sub">Door Check-In</span>
    </div>
    <button class="signout-btn" onclick="doLogout()">Sign Out</button>
  </header>

  <div id="event-banner">
    <div class="banner-grid">
      <div class="banner-item">
        <span class="banner-label">Event</span>
        <span class="banner-value gold" id="banner-name">—</span>
      </div>
      <div class="banner-item">
        <span class="banner-label">Date</span>
        <span class="banner-value" id="banner-date">—</span>
      </div>
      <div class="banner-item">
        <span class="banner-label">Venue</span>
        <span class="banner-value" id="banner-venue">—</span>
      </div>
      <div class="banner-item">
        <span class="banner-label">Time</span>
        <span class="banner-value" id="banner-time">—</span>
      </div>
    </div>
  </div>

  <div id="counter-bar">
    <span class="counter-num" id="counter-in">0</span>
    <span class="counter-sep">/</span>
    <span class="counter-total" id="counter-total">0</span>
    <span class="counter-label">Checked In</span>
    <span class="counter-pct" id="counter-pct"></span>
  </div>
  <div class="progress-bar-wrap">
    <div class="progress-bar-fill" id="progress-bar"></div>
  </div>

  <div class="search-wrap">
    <div class="search-input-wrap">
      <input
        type="text"
        id="search-input"
        class="search-input"
        placeholder="Search by name or phone..."
        autocomplete="off"
        autocorrect="off"
        autocapitalize="off"
        spellcheck="false"
        oninput="onSearch(this.value)"
      />
      <button class="clear-btn" id="clear-btn" onclick="clearSearch()">✕</button>
    </div>
  </div>

  <div class="alpha-bar" id="alpha-bar"></div>

  <div id="guest-list">
    <div class="state-msg">Loading guests...</div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const API = 'https://api.rsvpsociety.com';
let adminToken = '';
let allMembers = [];
let checkedIn = new Set();
let currentEventId = 'current';

function showToast(msg, type = '') {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show ' + type;
  setTimeout(() => { t.className = 'toast'; }, 2500);
}

document.getElementById('token-input').addEventListener('keydown', e => {
  if (e.key === 'Enter') doLogin();
});

async function doLogin() {
  const val = document.getElementById('token-input').value.trim();
  const errEl = document.getElementById('login-error');
  if (!val) return;
  const btn = document.getElementById('login-btn');
  btn.textContent = 'Loading...';
  errEl.textContent = '';

  try {
    const res = await fetch(`${API}/admin/event`, {
      headers: { 'x-admin-token': val }
    });
    if (res.status === 401 || res.status === 403) {
      errEl.textContent = 'Invalid token.';
      btn.textContent = 'Enter';
      return;
    }
    if (!res.ok) {
      errEl.textContent = `Error ${res.status}.`;
      btn.textContent = 'Enter';
      return;
    }
    adminToken = val;
    sessionStorage.setItem('rsvp_checkin_token', val);
    sessionStorage.setItem('rsvp_checkin_token_exp', Date.now() + 8 * 60 * 60 * 1000);
    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('app').style.display = 'flex';
    btn.textContent = 'Enter';
    // loadEvent must complete first so currentEventId is set before loadGuests fires
    await loadEvent();
    await loadGuests();
  } catch(err) {
    errEl.textContent = 'Network error.';
    btn.textContent = 'Enter';
  }
}

function doLogout() {
  adminToken = '';
  sessionStorage.removeItem('rsvp_checkin_token');
  sessionStorage.removeItem('rsvp_checkin_token_exp');
  allMembers = [];
  checkedIn = new Set();
  document.getElementById('app').style.display = 'none';
  document.getElementById('login-screen').style.display = 'flex';
  document.getElementById('token-input').value = '';
}

window.addEventListener('DOMContentLoaded', () => {
  const saved = sessionStorage.getItem('rsvp_checkin_token');
  const exp   = parseInt(sessionStorage.getItem('rsvp_checkin_token_exp') || '0', 10);
  if (saved && Date.now() < exp) {
    document.getElementById('token-input').value = saved;
    doLogin();
  } else if (saved) {
    // Expired — clear silently
    sessionStorage.removeItem('rsvp_checkin_token');
    sessionStorage.removeItem('rsvp_checkin_token_exp');
  }
});

async function loadEvent() {
  try {
    const res = await fetch(`${API}/admin/event`, { headers: { 'x-admin-token': adminToken } });
    const data = await res.json();
    if (data.ok && data.event && data.event.date) {
      const ev = data.event;
      // Fix #4: capture eventId so checkIn can pass it explicitly
      currentEventId = ev.eventSlug || ev.eventId || 'current';
      document.getElementById('banner-name').textContent = currentEventId || '—';
      document.getElementById('banner-date').textContent = ev.date || '—';
      document.getElementById('banner-venue').textContent = ev.venue || '—';
      document.getElementById('banner-time').textContent = ev.startTime || '—';
      document.getElementById('event-banner').style.display = 'block';
    }
  } catch(e) {
    console.error('loadEvent:', e);
  }
}

async function loadGuests() {
  try {
    const res = await fetch(`${API}/admin/members/confirmed?eventId=${encodeURIComponent(currentEventId)}`, {
      headers: { 'x-admin-token': adminToken }
    });
    const data = await res.json();
    if (!data.ok) throw new Error(data.error);

    allMembers = (data.members || []).sort((a, b) => {
      return (a.name || '').toLowerCase().localeCompare((b.name || '').toLowerCase());
    });

    // Fix #3: seed checkedIn from server data so a page refresh mid-event
    // doesn't wipe the green rows. Server returns checkedIn: bool per member.
    checkedIn = new Set(allMembers.filter(m => m.checkedIn).map(m => m.phone));

    updateCounter();
    renderAlphaBar();
    renderGuestList(allMembers);
  } catch(err) {
    document.getElementById('guest-list').innerHTML = '<div class="state-msg">Failed to load — check connection</div>';
  }
}

function updateCounter() {
  const total = allMembers.length;
  const inCount = checkedIn.size;
  document.getElementById('counter-in').textContent = inCount;
  document.getElementById('counter-total').textContent = total;
  const pct = total > 0 ? Math.round((inCount / total) * 100) : 0;
  document.getElementById('counter-pct').textContent = total > 0 ? pct + '%' : '';
  document.getElementById('progress-bar').style.width = pct + '%';
}

function renderAlphaBar() {
  const letters = new Set(allMembers.map(m => (m.name || '#')[0].toUpperCase()));
  const bar = document.getElementById('alpha-bar');
  bar.innerHTML = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('').map(l =>
    `<button class="alpha-btn ${letters.has(l) ? 'has-members' : ''}" onclick="jumpTo('${l}')">${l}</button>`
  ).join('');
}

function jumpTo(letter) {
  const el = document.getElementById('group-' + letter);
  if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function renderGuestList(members) {
  const list = document.getElementById('guest-list');
  if (!members.length) {
    list.innerHTML = '<div class="state-msg">No guests found</div>';
    return;
  }

  const groups = {};
  members.forEach(m => {
    const letter = (m.name || '#')[0].toUpperCase();
    if (!groups[letter]) groups[letter] = [];
    groups[letter].push(m);
  });

  list.innerHTML = Object.keys(groups).sort().map(letter => `
    <div id="group-${letter}">
      <div class="alpha-header">${letter}</div>
      ${groups[letter].map(m => renderRow(m)).join('')}
    </div>
  `).join('');
}

function renderRow(m) {
  const alreadyIn = checkedIn.has(m.phone);
  const safe = m.phone.replace(/\D/g, '');
  return `
    <div class="guest-row ${alreadyIn ? 'checked-in' : ''}" id="row-${safe}">
      <div class="guest-info">
        <div class="guest-name">${escHtml(m.name || '—')}</div>
        <div class="guest-meta">${m.phone}</div>
      </div>
      <button
        class="checkin-btn ${alreadyIn ? 'done' : ''}"
        id="btn-${safe}"
        onclick="checkIn('${m.phone}', '${escHtml(m.name || '')}')"
        ${alreadyIn ? 'disabled' : ''}
      >${alreadyIn ? '✓ In' : 'Check In'}</button>
    </div>`;
}

function onSearch(val) {
  document.getElementById('clear-btn').classList.toggle('visible', val.length > 0);
  const alphaBar = document.getElementById('alpha-bar');
  if (!val.trim()) {
    alphaBar.style.display = 'flex';
    renderGuestList(allMembers);
    return;
  }
  alphaBar.style.display = 'none';
  const q = val.toLowerCase();
  renderGuestList(allMembers.filter(m =>
    (m.name || '').toLowerCase().includes(q) || (m.phone || '').includes(q)
  ));
}

function clearSearch() {
  const input = document.getElementById('search-input');
  input.value = '';
  document.getElementById('clear-btn').classList.remove('visible');
  document.getElementById('alpha-bar').style.display = 'flex';
  renderGuestList(allMembers);
  input.focus();
}

async function checkIn(phone, name) {
  const safe = phone.replace(/\D/g, '');
  const btn = document.getElementById('btn-' + safe);
  const row = document.getElementById('row-' + safe);
  if (btn) { btn.disabled = true; btn.textContent = '...'; }

  try {
    const res = await fetch(`${API}/admin/members/attendance`, {
      method: 'POST',
      headers: { 'content-type': 'application/json', 'x-admin-token': adminToken },
      body: JSON.stringify({ phone, attended: true, eventId: currentEventId }),
    });
    const data = await res.json();
    if (!data.ok) throw new Error(data.error);

    checkedIn.add(phone);
    if (btn) { btn.textContent = '✓ In'; btn.classList.add('done'); }
    if (row) row.classList.add('checked-in');
    updateCounter();
    showToast(`${name || phone} checked in`, 'success');
  } catch (err) {
    if (btn) { btn.disabled = false; btn.textContent = 'Check In'; }
    showToast('Failed — try again', 'error');
  }
}

function escHtml(str) {
  return (str || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
</script>
</body>
</html>
