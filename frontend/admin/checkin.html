<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RSVP Society — Check In</title>
<meta name="robots" content="noindex, nofollow">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; connect-src https://api.rsvpsociety.com; img-src 'self' data:; object-src 'none'; base-uri 'none'; form-action 'self'; upgrade-insecure-requests;">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300&family=Montserrat:wght@200;300;400;500&display=swap" rel="stylesheet">
<link href="./base.css" rel="stylesheet">
<link href="./shell.css" rel="stylesheet">
<link href="./checkin.css" rel="stylesheet">

</head>
<body>

<div id="login-screen">
  <div class="login-wordmark">[RSVP] Society</div>
  <div class="login-box">
    <label class="login-label" for="token-input">Admin Token</label>
    <input type="password" id="token-input" class="login-input" placeholder="••••••••••••" autocomplete="off" />
    <button class="login-btn" id="login-btn" type="button">Enter</button>
    <div class="login-error" id="login-error"></div>
  </div>
</div>

<div hidden id="app">
  <nav class="nav checkin-nav">
    <div class="nav-left">
      <span class="nav-wordmark">[RSVP]</span>
      <span class="nav-title">Door Check-In</span>
    </div>
    <div class="nav-right">
      <button class="tab-btn" id="refresh-btn" type="button">Refresh</button>
      <button class="tab-btn" id="close-event-btn" type="button">Close Event</button>
      <button class="logout-btn" id="signout-btn" type="button">Sign Out</button>
    </div>
  </nav>

  <div class="door-shell">
  <div class="door-heading">
    <div>
      <div class="door-kicker">Live Door Operations</div>
      <h1 class="door-title" id="door-event-title">Check-In</h1>
      <div class="door-meta" id="door-event-meta">Loading event…</div>
    </div>
    <div class="door-status"><strong id="door-status-in">0</strong><span>checked in</span></div>
  </div>

  <div id="event-banner">
    <div class="banner-grid">
      <div class="banner-item">
        <span class="banner-label">Event</span>
        <span class="banner-value gold" id="banner-name">—</span>
      </div>
      <div class="banner-item">
        <span class="banner-label">Date</span>
        <span class="banner-value" id="banner-date">—</span>
      </div>
      <div class="banner-item">
        <span class="banner-label">Venue</span>
        <span class="banner-value" id="banner-venue">—</span>
      </div>
      <div class="banner-item">
        <span class="banner-label">Time</span>
        <span class="banner-value" id="banner-time">—</span>
      </div>
    </div>
    <div class="banner-note">Confirmed guests only. Failed check-ins usually mean the guest is not confirmed for this event.</div>
  </div>

  <div id="counter-bar">
    <span class="counter-num" id="counter-in">0</span>
    <span class="counter-sep">/</span>
    <span class="counter-total" id="counter-total">0</span>
    <span class="counter-label">Checked In</span>
    <span class="counter-pct" id="counter-pct"></span>
  </div>
  <div class="progress-bar-wrap">
    <div class="progress-bar-fill" id="progress-bar"></div>
  </div>

  <div class="search-wrap">
    <div class="search-input-wrap">
      <input
        type="text"
        id="search-input"
        class="search-input"
        placeholder="Search by name or phone..."
        autocomplete="off"
        autocorrect="off"
        autocapitalize="off"
        spellcheck="false"
      />
      <button class="clear-btn" id="clear-btn" type="button">✕</button>
    </div>
  </div>

  <details class="browse-guests">
    <summary>Browse guest list A–Z</summary>
    <div class="alpha-bar" id="alpha-bar"></div>
  </details>

  <div id="guest-list">
    <div class="state-msg">Loading guests...</div>
  </div>
</div>
</div>

<div class="toast" id="toast"></div>

<script type="module" src="./checkin.js"></script>
</body>
</html>
