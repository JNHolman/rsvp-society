name: Deploy RSVP Society Backend

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  AWS_REGION: us-east-1

jobs:
  deploy-lambdas:
    name: Package & Deploy Lambda Functions
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build Lambda package
        run: |
          mkdir -p build
          cp lambda/*.py build/
          cd build && zip -r ../lambda_bundle.zip . && cd ..
          echo "Package size: $(du -sh lambda_bundle.zip | cut -f1)"

      - name: Deploy rsvp-access-request
        run: |
          aws lambda update-function-code \
            --function-name rsvp-access-request \
            --zip-file fileb://lambda_bundle.zip \
            --no-cli-pager

      - name: Deploy rsvp-admin-handler
        run: |
          aws lambda update-function-code \
            --function-name rsvp-admin-handler \
            --zip-file fileb://lambda_bundle.zip \
            --no-cli-pager

      - name: Deploy rsvp-sms-handler
        run: |
          aws lambda update-function-code \
            --function-name rsvp-sms-handler \
            --zip-file fileb://lambda_bundle.zip \
            --no-cli-pager

      - name: Deploy rsvp-event-handler
        run: |
          aws lambda update-function-code \
            --function-name rsvp-event-handler \
            --zip-file fileb://lambda_bundle.zip \
            --no-cli-pager

      - name: Deploy rsvp-invite-handler
        run: |
          aws lambda update-function-code \
            --function-name rsvp-invite-handler \
            --zip-file fileb://lambda_bundle.zip \
            --no-cli-pager

      - name: Wait for all functions to finish updating
        run: |
          for fn in rsvp-access-request rsvp-admin-handler rsvp-sms-handler rsvp-event-handler rsvp-invite-handler; do
            echo "Waiting on $fn..."
            aws lambda wait function-updated --function-name $fn
          done
          echo "All Lambda functions live."

  terraform-apply:
    name: Terraform Apply
    runs-on: ubuntu-latest
    needs: deploy-lambdas

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.6.6"

      - name: Terraform Init
        working-directory: ./terraform
        run: terraform init -input=false

      - name: Terraform Validate
        working-directory: ./terraform
        run: terraform validate

      - name: Terraform Plan
        working-directory: ./terraform
        run: terraform plan -input=false -out=tfplan

      - name: Terraform Apply
        working-directory: ./terraform
        run: terraform apply -input=false -auto-approve tfplan

      - name: Write deployment summary
        run: |
          echo "## RSVP Society Deployment" >> $GITHUB_STEP_SUMMARY
          echo "| | |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| **Branch** | ${{ github.ref_name }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Commit** | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Actor** | ${{ github.actor }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Time** | $(date -u) |" >> $GITHUB_STEP_SUMMARY
